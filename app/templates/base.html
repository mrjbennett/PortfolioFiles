<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Demo Billing{% endblock %}</title>
  <style>
    :root { --ink: #1b1f24; --muted: #5b6573; --line: #d6dbe1; --accent: #1f5fbf; --bad: #b3261e; --ok: #1b7a3d; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: #f7f8fa; }
    main { max-width: 28rem; margin: 0 auto; padding: 1.5rem 1rem 7rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    label { display: block; font-size: .9rem; margin: 1rem 0 .25rem; color: var(--muted); }
    input, select { width: 100%; padding: .65rem .75rem; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    button, .button { display: inline-block; width: 100%; padding: .75rem 1rem; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px; text-align: center; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    .msg { min-height: 1.5rem; margin-top: 1rem; }
    .msg.bad { color: var(--bad); }
    .msg.ok { color: var(--ok); font-weight: 600; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); }
    .bar > * { max-width: 28rem; margin: 0 auto; display: block; }
    footer.build { margin-top: 2rem; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
<main>
  {% block body %}{% endblock %}
  <footer class="build" data-testid="build">Build {{ version }}</footer>
</main>
</body>
</html>
