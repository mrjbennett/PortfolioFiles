[pytest]
testpaths = tests/suites
pythonpath = tests
addopts = -ra
markers =
    smoke: fast set, safe to run on every commit
    regression: full regression pass
    slow: takes noticeably longer than the rest
    tc(id): the manual test case this automates (see docs/test-cases.csv)
    known_defect(id): fails on the rc3 build by design; passes on the fixed build
